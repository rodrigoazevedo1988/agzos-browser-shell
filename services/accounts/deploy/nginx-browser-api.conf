# Contas Agzos: dentro dos DOIS server { } de agzosagency.com.br (443 e 80, que recebe o
# Cloudflare Tunnel), antes do location do OTA. Não mexe em /api/ nem em /api/v1/.
# Pelo Cloudflare o IP real vem em CF-Connecting-IP (vazio: a API usa o socket); sem isso
# todo mundo teria o IP do tunnel e dividiria o mesmo limite de tentativas.
location ^~ /browser-api/ {
    proxy_pass http://127.0.0.1:3920/browser-api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
}
