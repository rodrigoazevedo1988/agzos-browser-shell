<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Agzos Browser</title>
  <desc id="d">Navegue com clareza. Decida com controle.</desc>
  <style>
    .bg { fill: #0e0e0e; }
    .grid { stroke: #ffffff; stroke-opacity: .05; }
    .glow { transform-origin: 640px 210px; animation: pulse 6s ease-in-out infinite; }
    .orb1 { animation: drift1 14s ease-in-out infinite; }
    .orb2 { animation: drift2 18s ease-in-out infinite; }
    .ring { fill: none; stroke: #d10a11; stroke-width: 2; stroke-opacity: .7; transform-origin: 186px 210px; animation: spin 18s linear infinite; }
    .ring2 { fill: none; stroke: #fffdfd; stroke-opacity: .25; stroke-width: 1; stroke-dasharray: 4 10; transform-origin: 186px 210px; animation: spin 26s linear infinite reverse; }
    .mark { transform-origin: 186px 210px; animation: breathe 4s ease-in-out infinite; }
    .title { font: 800 72px "Manrope", "Segoe UI", Arial, sans-serif; fill: #fffdfd; letter-spacing: -1px; opacity: 0; animation: rise .9s .2s ease-out forwards; }
    .accent { fill: #d10a11; }
    .tag { font: 500 26px "Manrope", "Segoe UI", Arial, sans-serif; fill: #fffdfd; fill-opacity: .72; opacity: 0; animation: rise .9s .5s ease-out forwards; }
    .chip { opacity: 0; animation: rise .7s ease-out forwards; }
    .chip rect { fill: #1a1a1a; stroke: #d10a11; stroke-opacity: .45; }
    .chip text { font: 600 16px "Manrope", "Segoe UI", Arial, sans-serif; fill: #fffdfd; }
    .c1 { animation-delay: .8s; } .c2 { animation-delay: .95s; } .c3 { animation-delay: 1.1s; } .c4 { animation-delay: 1.25s; }
    .scan { animation: scan 5s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.08); } }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-30px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-70px,25px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scan { from { transform: translateX(-200px); } to { transform: translateX(1480px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  </style>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d10a11" stop-opacity=".55"/>
      <stop offset="1" stop-color="#d10a11" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d55" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff4d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#d10a11" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d10a11" stop-opacity=".35"/>
      <stop offset="1" stop-color="#d10a11" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="420" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect class="bg" width="1280" height="420"/>
    <g class="grid">
      <path d="M0 70H1280M0 140H1280M0 210H1280M0 280H1280M0 350H1280"/>
      <path d="M160 0V420M320 0V420M480 0V420M640 0V420M800 0V420M960 0V420M1120 0V420"/>
    </g>
    <circle class="glow" cx="640" cy="210" r="420" fill="url(#g1)"/>
    <circle class="orb1" cx="1050" cy="90" r="160" fill="url(#g2)"/>
    <circle class="orb2" cx="300" cy="360" r="190" fill="url(#g2)"/>
    <rect class="scan" x="0" y="0" width="200" height="420" fill="url(#beam)"/>
    <circle class="ring" cx="186" cy="210" r="104" stroke-dasharray="120 40"/>
    <circle class="ring2" cx="186" cy="210" r="124"/>
    <g class="mark">
      <g transform="translate(95 124) scale(.6)">
        <path d="M277.023 143.111C277.023 215.939 226.055 281.111 154.356 281.111C230.571 281.111 299.001 219.326 299.001 143.111C299.001 66.8958 230.571 5.11111 154.356 5.11111C226.055 5.11111 277.023 70.2832 277.023 143.111Z" fill="#D10A11"/>
        <path d="M154.356 281.111C226.055 281.111 277.023 215.939 277.023 143.111C277.023 70.2832 226.055 5.11111 154.356 5.11111M154.356 281.111C82.2746 281.111 23.3547 228.886 17.1477 158.417M154.356 281.111C230.571 281.111 299.001 219.326 299.001 143.111C299.001 66.8958 230.571 5.11111 154.356 5.11111M154.356 5.11111C114.617 5.11111 78.8014 21.908 53.6211 48.7894C52.4194 50.0723 53.3452 52.1333 55.1031 52.1333H82.0964H213.358C215.066 52.1333 216.021 54.1032 214.963 55.444L84.7081 220.556C83.6504 221.897 84.6054 223.867 86.3132 223.867H229.203C230.798 223.867 231.779 222.122 230.95 220.76L150.442 88.41C149.693 87.178 147.938 87.0881 147.067 88.2371L109.1 138.304M109.1 138.304C104.186 134.506 97.1244 135.41 93.3265 140.323C89.5286 145.237 90.4328 152.299 95.3462 156.097C100.26 159.894 107.322 158.99 111.12 154.077C114.917 149.163 114.013 142.101 109.1 138.304ZM17.1477 158.417C23.3424 157.979 28.0099 152.603 27.5728 146.409C27.1357 140.214 21.7596 135.546 15.5648 135.983C9.3701 136.421 4.7026 141.797 5.13968 147.991C5.57677 154.186 10.9529 158.854 17.1477 158.417Z" stroke="#FFFDFD" stroke-width="10.2222" fill="none"/>
      </g>
    </g>
    <text class="title" x="340" y="190">Agzos <tspan class="accent">Browser</tspan></text>
    <text class="tag" x="342" y="238">Navegue com clareza. Decida com controle.</text>
    <g class="chip c1"><rect x="342" y="276" width="170" height="40" rx="20"/><text x="427" y="302" text-anchor="middle">Agzos AI</text></g>
    <g class="chip c2"><rect x="524" y="276" width="190" height="40" rx="20"/><text x="619" y="302" text-anchor="middle">Agzos Key</text></g>
    <g class="chip c3"><rect x="726" y="276" width="200" height="40" rx="20"/><text x="826" y="302" text-anchor="middle">Adblock real</text></g>
    <g class="chip c4"><rect x="938" y="276" width="240" height="40" rx="20"/><text x="1058" y="302" text-anchor="middle">Dev no navegador</text></g>
  </g>
</svg>
