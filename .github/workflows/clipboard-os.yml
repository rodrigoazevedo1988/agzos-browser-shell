name: Print no terminal (Windows, Mac, Linux)

# 4.9.6: a colagem de print no terminal lê a área de transferência do sistema, que é
# diferente em cada um; este job põe uma imagem pelo caminho nativo e roda o mesmo código
# do main (electron/clipboard-image.cjs).
on:
  pull_request:
    paths:
      [
        electron/clipboard-image.cjs,
        scripts/clipboard-image-smoke.cjs,
        .github/workflows/clipboard-os.yml,
      ]
  push:
    branches: [main]
    paths:
      [
        electron/clipboard-image.cjs,
        scripts/clipboard-image-smoke.cjs,
        .github/workflows/clipboard-os.yml,
      ]
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Electron da mesma versão do app
        shell: bash
        run: |
          version=$(node -p "require('./package.json').devDependencies.electron")
          mkdir -p "$RUNNER_TEMP/electron" && cd "$RUNNER_TEMP/electron"
          npm init -y >/dev/null && npm install --no-audit --no-fund "electron@$version"
          echo "ELECTRON=$RUNNER_TEMP/electron/node_modules/.bin/electron" >> "$GITHUB_ENV"

      - name: Windows — imagem como a Ferramenta de Captura (CF_DIB)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 37, 21
          $g = [System.Drawing.Graphics]::FromImage($bmp); $g.Clear([System.Drawing.Color]::Orange); $g.Dispose()
          [System.Windows.Forms.Clipboard]::SetImage($bmp)
      - name: Windows — lê e salva
        if: runner.os == 'Windows'
        shell: bash
        run: '"$ELECTRON" scripts/clipboard-image-smoke.cjs 37 21'

      - name: Mac — imagem como o Cmd+Ctrl+Shift+4 (PNGf)
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import struct, zlib
          w, h = 37, 21
          raw = b"".join(b"\x00" + b"\xff\x80\x00" * w for _ in range(h))
          chunk = lambda t, d: struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d))
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("/tmp/print.png", "wb").write(png)
          PY
          osascript -e 'set the clipboard to (read (POSIX file "/tmp/print.png") as «class PNGf»)'
          "$ELECTRON" scripts/clipboard-image-smoke.cjs 37 21

      - name: Linux — imagem pelo xclip (X11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xclip imagemagick >/dev/null
          convert -size 37x21 xc:orange /tmp/print.png
          export DISPLAY=:99 && (Xvfb :99 -screen 0 1024x768x24 &) && sleep 2
          (xclip -selection clipboard -t image/png -i /tmp/print.png &) && sleep 1
          "$ELECTRON" --no-sandbox scripts/clipboard-image-smoke.cjs 37 21

      # 4.9.7: print numa sessão SSH contra um sshd local com chave, com sh do outro lado como
      # numa VPS. O cliente é o mesmo ssh que o app escolhe (ssh.exe do System32 no Windows).
      - name: SSH — sshd local com chave (Linux e Mac)
        if: runner.os != 'Windows'
        run: |
          d="$RUNNER_TEMP/sshd" && mkdir -p "$d" && chmod 700 "$d"
          ssh-keygen -q -t ed25519 -N "" -f "$d/host_key"
          ssh-keygen -q -t ed25519 -N "" -f "$d/user_key"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$d/user_key.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          printf '%s\n' "Port 2299" "ListenAddress 127.0.0.1" "HostKey $d/host_key" \
            "AuthorizedKeysFile .ssh/authorized_keys" "PasswordAuthentication no" \
            "KbdInteractiveAuthentication no" "StrictModes no" "PidFile $d/sshd.pid" > "$d/sshd_config"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # A conta do runner vem bloqueada ("!"), e o sshd recusa conta bloqueada sem PAM.
            sudo usermod -p '*' "$(whoami)"
            sudo mkdir -p /run/sshd && sudo /usr/sbin/sshd -f "$d/sshd_config" -E "$d/log"
          else
            /usr/sbin/sshd -f "$d/sshd_config" -E "$d/log"
          fi
          sleep 2
          node scripts/ssh-print-smoke.cjs 2299 "$(whoami)" "$d/user_key" || { cat "$d/log"; exit 1; }

      - name: SSH — OpenSSH Server do Windows com sh do Git (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          }
          New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Program Files\Git\bin\sh.exe" -PropertyType String -Force | Out-Null
          $d = Join-Path $env:RUNNER_TEMP "sshkey"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          & "C:\Program Files\Git\usr\bin\ssh-keygen.exe" -q -t ed25519 -N '""' -f "$d\user_key"
          if (-not (Test-Path "$d\user_key")) { & "C:\Program Files\Git\usr\bin\ssh-keygen.exe" -q -t ed25519 -N "" -f "$d\user_key" }
          icacls "$d\user_key" /inheritance:r /grant:r "$($env:USERNAME):F" | Out-Null
          $keys = "C:\ProgramData\ssh\administrators_authorized_keys"
          Start-Service sshd; Start-Sleep 2
          Copy-Item "$d\user_key.pub" $keys -Force
          icacls $keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F" | Out-Null
          Restart-Service sshd; Start-Sleep 2
          node scripts/ssh-print-smoke.cjs 22 $env:USERNAME "$d\user_key"
          if ($LASTEXITCODE -ne 0) { Get-Content C:\ProgramData\ssh\logs\sshd.log -ErrorAction SilentlyContinue | Select-Object -Last 30; exit 1 }
